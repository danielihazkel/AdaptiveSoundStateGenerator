name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # jsdom 30 (the React test environment) needs Node ^22.22 / ^24.15.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm run e2e:qa
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      # The bundle the app ships: no service worker (vite.config.ts, native mode).
      - run: npm run android:sync
      - run: test ! -e dist/sw.js
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android
      # A debug APK to sideload from every push (Actions → this run → Artifacts).
      - uses: actions/upload-artifact@v4
        with:
          name: resonance-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
